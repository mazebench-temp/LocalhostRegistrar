<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f0">
  <title>Localhost</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main aria-label="Home screen"><div id="app-grid" class="app-grid"></div></main>
  <nav class="dock" aria-label="Controls">
    <button id="issues-button" class="dock-button" aria-label="Registration issues" title="Registration issues" hidden>!</button>
    <button id="stop-all" class="dock-button" aria-label="Shut down everything, including Localhost" title="Shut down everything, including Localhost">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M16 3v12"/><path d="M8.2 7.8a11 11 0 1 0 15.6 0"/></svg>
    </button>
  </nav>
  <dialog id="app-menu" aria-labelledby="menu-name">
    <div class="menu-heading"><h1 id="menu-name"></h1><button class="close-button" data-close aria-label="Close">×</button></div>
    <button class="menu-action" id="menu-launch">Restart &amp; open <span aria-hidden="true">↗</span></button>
    <a class="menu-action" id="menu-open" target="_blank" rel="noopener">Open <span aria-hidden="true">↗</span></a>
    <button class="menu-action danger" id="menu-stop">Shut down <span aria-hidden="true">⏻</span></button>
    <details id="output"><summary>Logs</summary><pre id="logs" tabindex="0"></pre></details>
    <p id="app-error" class="error-text" hidden></p>
  </dialog>
  <dialog id="issues-dialog" aria-labelledby="issues-title"><div class="menu-heading"><h1 id="issues-title">Registration issues</h1><button class="close-button" data-close aria-label="Close">×</button></div><div id="issues"></div></dialog>
  <div id="notice" class="notice" role="status" hidden></div>
  <span id="announcement" class="sr-only" aria-live="polite"></span>
</body>
</html>
